<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>StudioLumina | Dashboard Inteligente</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .ai-section {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-radius: 24px;
    }

    .ai-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 16px;
    }

    .ai-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #e2e8f0;
      padding: 14px 16px;
      outline: none;
    }

    .ai-input:focus {
      border-color: #4f8ef7;
      box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.2);
    }

    .ai-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f8ef7, #a855f7);
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .ai-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Clases requeridas para renderResultado en app.js */
    .result-box {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .result-box.POSITIVE {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .result-box.NEGATIVE {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .result-label {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .result-label.POSITIVE {
      color: #22c55e;
    }

    .result-label.NEGATIVE {
      color: #ef4444;
    }

    .confidence-bar-wrap {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin: 8px 0;
    }

    .confidence-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .POSITIVE .confidence-bar-fill {
      background: #22c55e;
    }

    .NEGATIVE .confidence-bar-fill {
      background: #ef4444;
    }

    .ai-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    .ai-table th {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .ai-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-pos {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .badge-neg {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .badge-neu {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .badge-irr {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }

    .badge-match {
      background: rgba(79, 142, 247, 0.2);
      color: #60a5fa;
    }

    .ai-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="w-full bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
    <nav class="flex justify-between items-center max-w-7xl mx-auto px-6 py-4">
      <div class="text-xl font-bold text-blue-400">StudioLumina</div>
      <div class="flex items-center gap-6">
        <span class="text-sm text-slate-400">👤 Usuario: <strong class="text-slate-200">{{ user }}</strong></span>
        <a href="/logout"
          class="text-xs font-semibold bg-red-950/40 text-red-400 border border-red-900/50 hover:bg-red-900/30 px-4 py-2 rounded-full transition-colors">Salir</a>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <section class="ai-section p-8 md:p-12 shadow-2xl">
      <div class="max-w-4xl mx-auto">

        <div class="text-center mb-10">
          <span
            class="inline-block px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-3">
            🤖 Inferencia Local • DistilBERT Sst-2
          </span>
          <h2 class="text-3xl font-bold text-white">Consola de Control Fullstack</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

          <div class="ai-card p-6 flex flex-col justify-between">
            <div>
              <h3 class="text-white font-semibold mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-blue-400">analytics</span> Analizador en Vivo
              </h3>
              <textarea id="textInput" class="ai-input h-36 resize-none"
                placeholder="Escribe tu reseña o comentario en inglés aquí... (Ctrl + Enter)"></textarea>
              <div id="resultado"></div>
            </div>
            <div class="mt-4 flex justify-end">
              <button id="analyzeBtn" onclick="enviarDatos()" class="ai-btn">
                <span id="spinner" class="ai-spinner"></span>
                <span class="btn-label">Analizar Sentimiento</span>
              </button>
            </div>
          </div>

          <div class="ai-card p-6 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-white font-semibold flex items-center gap-2">
                  <span class="material-symbols-outlined text-purple-400">database</span> Dataset Validation
                </h3>
                <button id="loadBtn" onclick="cargarDataset()"
                  class="bg-slate-800 hover:bg-slate-700 text-purple-400 font-medium px-3 py-1.5 rounded-lg text-xs border border-slate-700 transition-all flex items-center gap-1">
                  <span class="material-symbols-outlined text-sm">refresh</span> Cargar Datos
                </button>
              </div>
              <div id="dataset-container" class="max-h-72 overflow-y-auto pr-2">
                <p class="text-slate-500 text-xs text-center py-16">Haz clic en "Cargar Datos" para mapear las métricas
                  de HuggingFace contra el CSV de Kaggle.</p>
              </div>
            </div>
          </div>

        </div>

      </div>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>

</html>
