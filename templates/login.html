<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Sentiment Analyzer</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo" aria-hidden="true">🤖</div>
      <h1>Sentiment Analyzer</h1>
      <p>Ingresa con tu cuenta institucional para continuar</p>

      {% if error %}
      <div class="error-msg" role="alert">⚠️ {{ error }}</div>
      {% endif %}

      <form id="loginForm" action="/login" method="post" novalidate>

        <div class="input-group">
          <label for="email">Correo institucional</label>
          <input type="email" id="email" name="email" placeholder="usuario@lasallistas.org.mx" autocomplete="email"
            required />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
            required />
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          Ingresar
        </button>

      </form>
